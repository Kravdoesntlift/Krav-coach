<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>KRAV · Offline</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-text-size-adjust:100%}
    body{display:flex;flex-direction:column;min-height:100vh;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
    .wrap{flex:1;display:flex;flex-direction:column;max-width:420px;margin:0 auto;width:100%;padding:2.5rem 1.25rem 1.5rem}
    .logo{text-align:center;margin-bottom:2rem;font-size:1.5rem;font-weight:900;letter-spacing:-.05em}
    .logo span{color:#C9A84C}
    .banner{display:flex;align-items:center;gap:.75rem;background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.2);border-radius:16px;padding:.75rem 1rem;margin-bottom:1.25rem}
    .banner-icon{font-size:1.4rem;flex-shrink:0}
    .banner-title{font-weight:700;font-size:.875rem}
    .banner-sub{color:#71717a;font-size:.75rem;margin-top:.1rem}
    .queue-banner{background:rgba(201,168,76,.07);border:1px solid rgba(201,168,76,.2);border-radius:16px;padding:.75rem 1rem;margin-bottom:1.25rem}
    .queue-title{color:#C9A84C;font-weight:700;font-size:.875rem}
    .queue-sub{color:#71717a;font-size:.75rem;margin-top:.2rem}
    .section-label{color:#71717a;font-size:.65rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.75rem;display:flex;justify-content:space-between;align-items:center}
    .cached-at{color:#3f3f46;font-size:.6rem}
    .card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:16px;overflow:hidden;margin-bottom:1rem}
    .card-head{padding:.75rem 1rem;border-bottom:1px solid rgba(255,255,255,.07)}
    .card-label{font-weight:700;font-size:.875rem}
    .ex-list{list-style:none}
    .ex-item{display:flex;align-items:center;gap:.75rem;padding:.625rem 1rem;border-bottom:1px solid rgba(255,255,255,.04)}
    .ex-item:last-child{border-bottom:none}
    .ex-num{width:1.4rem;height:1.4rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:900;color:#000;flex-shrink:0;background:linear-gradient(135deg,#E8C96B,#A8893A)}
    .ex-name{font-size:.875rem;color:#fff}
    .rest-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:1.5rem;text-align:center;margin-bottom:1rem}
    .rest-emoji{font-size:2.5rem}
    .rest-title{font-weight:700;margin:.75rem 0 .25rem}
    .rest-sub{color:#71717a;font-size:.875rem}
    .no-data{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1rem;padding:2rem 0}
    .no-data-icon{font-size:3rem}
    .no-data-title{font-weight:700}
    .no-data-sub{color:#71717a;font-size:.875rem;line-height:1.5}
    .week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.25rem;margin-bottom:1.25rem}
    .week-cell{display:flex;flex-direction:column;align-items:center;gap:.2rem;padding:.5rem .1rem;border-radius:10px;font-size:.6rem}
    .week-cell-rest{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05)}
    .week-cell-train{background:rgba(201,168,76,.07);border:1px solid rgba(201,168,76,.2)}
    .week-cell span:last-child{color:#52525b;line-height:1}
    .quote{background:rgba(201,168,76,.05);border:1px solid rgba(201,168,76,.1);border-radius:16px;padding:1rem 1.25rem;text-align:center;margin-bottom:1rem}
    .quote p{color:#C9A84C;font-size:.875rem;font-weight:600;font-style:italic}
    .btn{display:block;width:100%;padding:1rem;border:none;border-radius:16px;font-size:.875rem;font-weight:900;color:#000;background:linear-gradient(135deg,#E8C96B,#A8893A);cursor:pointer;margin-top:auto}
    .btn:active{transform:scale(.97)}
  </style>
</head>
<body>
<div class="wrap">
  <div class="logo">KRAV<span>.</span></div>

  <div class="banner">
    <span class="banner-icon">📡</span>
    <div>
      <div class="banner-title">Sem ligação à internet</div>
      <div class="banner-sub">A mostrar dados guardados localmente</div>
    </div>
  </div>

  <div id="queue-section" style="display:none" class="queue-banner">
    <div class="queue-title" id="queue-title"></div>
    <div class="queue-sub">Serão sincronizadas quando a ligação for restaurada.</div>
  </div>

  <div id="content"></div>

  <div class="quote"><p>&#8220;A disciplina não precisa de wi-fi.&#8221;</p></div>

  <button class="btn" onclick="location.reload()">Tentar novamente</button>
</div>

<script>
(function(){
  // Queue badge
  try{
    var q=JSON.parse(localStorage.getItem('krav_offline_queue')||'[]');
    if(q.length){
      document.getElementById('queue-section').style.display='block';
      document.getElementById('queue-title').textContent=q.length+(q.length===1?' ação pendente':' ações pendentes');
    }
  }catch(e){}

  // Workout cache
  var w=null;
  try{w=JSON.parse(localStorage.getItem('krav_today_workout'));}catch(e){}

  var el=document.getElementById('content');

  if(!w){
    el.innerHTML='<div class="no-data"><div class="no-data-icon">📭</div><div class="no-data-title">Sem dados guardados</div><div class="no-data-sub">Abre a app enquanto estás online para guardar o teu plano para consulta offline.</div></div>';
    return;
  }

  // Cached date
  var dateStr='';
  if(w.cachedAt){
    try{
      var d=new Date(w.cachedAt);
      dateStr='Guardado '+d.toLocaleDateString('pt-PT',{day:'numeric',month:'long'})+' às '+d.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});
    }catch(e){}
  }

  var html='<div class="section-label"><span>Treino de hoje</span>'+(dateStr?'<span class="cached-at">'+dateStr+'</span>':'')+'</div>';

  if(w.isRest){
    html+='<div class="rest-card"><div class="rest-emoji">💤</div><div class="rest-title">Dia de descanso</div><div class="rest-sub">Recupera bem hoje!</div></div>';
  } else {
    html+='<div class="card">';
    if(w.label) html+='<div class="card-head"><div class="card-label">'+esc(w.label)+'</div></div>';
    if(w.exercises&&w.exercises.length){
      html+='<ul class="ex-list">';
      for(var i=0;i<w.exercises.length;i++){
        html+='<li class="ex-item"><span class="ex-num">'+(i+1)+'</span><span class="ex-name">'+esc(w.exercises[i])+'</span></li>';
      }
      html+='</ul>';
    } else {
      html+='<div style="padding:.75rem 1rem;color:#52525b;font-size:.875rem">Sem exercícios guardados.</div>';
    }
    html+='</div>';
  }

  // Week grid
  if(w.weekDays&&w.weekDays.length){
    html+='<div class="section-label"><span>Esta semana</span></div><div class="week-grid">';
    for(var j=0;j<w.weekDays.length;j++){
      var day=w.weekDays[j];
      html+='<div class="week-cell '+(day.isRest?'week-cell-rest':'week-cell-train')+'">';
      html+='<span>'+(day.isRest?'💤':'💪')+'</span>';
      html+='<span>'+(day.isRest?'Desc':(day.exercises.length+'ex'))+'</span>';
      html+='</div>';
    }
    html+='</div>';
  }

  el.innerHTML=html;

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
})();
</script>
</body>
</html>
